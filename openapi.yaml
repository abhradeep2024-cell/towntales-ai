openapi: 3.1.0
info:
  title: ChatGPT Film Studio API
  version: 0.1.0
  description: Authenticated interface for creating and managing video production jobs.
servers:
  - url: https://film-studio-api.onrender.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Check API health
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  databaseConfigured: { type: boolean }
                  databaseConnected: { type: boolean }
  /openapi.yaml:
    get:
      operationId: getOpenApiSchema
      summary: Get the current Film Studio Action schema
      security: []
      responses:
        '200':
          description: OpenAPI schema
          content:
            application/yaml:
              schema: { type: string }
  /v1/styles:
    get:
      operationId: listFilmStyles
      summary: List the pinned Lemo-Opuscar styles
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search style name, slug, translated name or sample title.
        - in: query
          name: category
          required: false
          schema: { type: string }
          description: Exact Lemo style category.
      responses:
        '200':
          description: Available visual styles
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  styles:
                    type: array
                    items: { $ref: '#/components/schemas/Style' }
        '401': { description: Unauthorized }
  /v1/styles/{slug}/engine:
    get:
      operationId: getFilmStyleEngine
      summary: List pinned style source files or read a specific file
      description: >-
        Without file, returns the selected style's engine, bootstrap and demo-reference file list.
        Supply file using one exact path from that list to retrieve its source. Demo-reference files can
        contain story-specific example content and must only be studied for implementation technique.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: file
          required: false
          schema: { type: string }
          description: Exact relative path returned by the listing response (for example engine/deco.js).
      responses:
        '200':
          description: Style source index or one pinned source file
          content:
            application/json:
              schema:
                type: object
                properties:
                  styleSlug: { type: string }
                  file: { type: string }
                  role: { type: string, enum: [engine, bootstrap, demo-reference] }
                  sourceCommit: { type: string }
                  content: { type: string }
                  engineFiles: { type: array, items: { type: object } }
                  bootstrapFiles: { type: array, items: { type: object } }
                  demoReferenceFiles: { type: array, items: { type: object } }
        '401': { description: Unauthorized }
        '404': { description: Style or source file not found }
        '502': { description: Pinned source unavailable }
  /v1/styles/{slug}:
    get:
      operationId: getFilmStyleGuide
      summary: Retrieve a style's directing and visual invariants
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Style and full STYLE.md guide
          content:
            application/json:
              schema:
                type: object
                properties:
                  style: { $ref: '#/components/schemas/Style' }
                  styleGuide: { type: string }
                  sourceCommit: { type: string }
        '401': { description: Unauthorized }
        '404': { description: Style not found }
  /v1/jobs:
    post:
      operationId: createRenderJob
      summary: Create a video production job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [production]
              properties:
                production:
                  $ref: '#/components/schemas/ProductionSpec'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': { description: Invalid production specification }
        '401': { description: Unauthorized }
        '503': { description: Job creation unavailable }
  /v1/jobs/{id}:
    get:
      operationId: getRenderJob
      summary: Get job status and quality report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401': { description: Unauthorized }
        '404': { description: Job not found }
  /v1/jobs/{id}/retry:
    post:
      operationId: retryRenderJob
      summary: Requeue a failed job when retry attempts remain
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Retry queued }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Job is not retryable or retry limit reached }
        '503': { description: Retry operation unavailable }
  /v1/jobs/{id}/cancel:
    post:
      operationId: cancelRenderJob
      summary: Cancel a queued or rendering job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cancellation recorded }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Job is not cancellable }
  /v1/jobs/{id}/artifacts:
    get:
      operationId: getRenderArtifacts
      summary: Retrieve signed URLs for verified production manifest, alignment and QA sidecars
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Short-lived signed URLs for available production artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        url: { type: string, format: uri }
                        expiresInSeconds: { type: integer }
                        bytes: { type: integer }
                        sha256: { type: string }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Artifacts not ready }
  /v1/jobs/{id}/output:
    get:
      operationId: getRenderOutput
      summary: Retrieve a short-lived signed MP4 URL after QC
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed output URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresInSeconds]
                properties:
                  url: { type: string, format: uri }
                  expiresInSeconds: { type: integer }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Output not ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Style:
      type: object
      required: [slug, name, category]
      properties:
        slug: { type: string }
        name: { type: string }
        nameZh: { type: string }
        category: { type: string }
        demo: { type: string }
    Scene:
      type: object
      required: [id, title, durationSeconds, visualDirection]
      properties:
        id: { type: string, maxLength: 80 }
        title: { type: string, maxLength: 160 }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 90 }
        narration: { type: string, maxLength: 5000 }
        visualDirection: { type: string, maxLength: 4000 }
        environmentId: { type: string, maxLength: 100 }
        onScreenText:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    Environment:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        assetId: { type: string }
        locationDescription: { type: string }
        timeOfDay: { type: string }
        weather: { type: string }
        atmosphere: { type: string }
        background: { type: string }
        groundColor: { type: string }
        continuityNotes: { type: array, items: { type: string } }
    ProductionSpec:
      type: object
      required: [schemaVersion, title, idea, styleId, durationSeconds, aspectRatio, scenes]
      properties:
        schemaVersion: { const: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        idea: { type: string, minLength: 1, maxLength: 8000 }
        styleId: { type: string, minLength: 1, maxLength: 120 }
        styleInvariants:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 500 }
        durationSeconds: { type: integer, minimum: 1, maximum: 90 }
        aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1'] }
        fps: { type: integer, enum: [24, 25, 30], default: 30 }
        width: { type: integer, minimum: 320, maximum: 1920, description: 'Optional. If omitted, derived from aspectRatio; defaults to 1280 for 16:9, 720 for 9:16, and 1080 for 1:1.' }
        height: { type: integer, minimum: 320, maximum: 1920, description: 'Optional. If omitted, derived from aspectRatio; defaults to 720 for 16:9, 1280 for 9:16, and 1080 for 1:1.' }
        projectFiles:
          type: object
          description: >-
            Optional complete Lemo-Opuscar film page, generated specifically for this production.
            Must contain index.html implementing window.DUR, window.render(t), and window.READY.
            Use only local text files; keep the total below 1.8 MB. No remote scripts or assets.
          additionalProperties: { type: string }
        environments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Environment' }
        characters:
          type: array
          maxItems: 100
          items: { type: object, required: [id, name, rig], properties: { id: { type: string }, name: { type: string }, rig: { type: string } } }
        scenes:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/Scene' }
        subtitles:
          type: array
          maxItems: 300
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: number, minimum: 0 }
              end: { type: number, exclusiveMinimum: 0 }
              text: { type: string, minLength: 1, maxLength: 500 }
        audio:
          type: object
          properties:
            musicEnabled: { type: boolean, default: true }
            voiceEnabled: { type: boolean, default: true }
            burnSubtitles: { type: boolean, default: false }
            voice: { type: string, default: en-US-AriaNeural }
            musicStyle: { type: string, enum: [ambient, uplifting, suspense], default: ambient }
            musicVolume: { type: number, minimum: 0, maximum: 0.5, default: 0.12 }
            voiceVolume: { type: number, minimum: 0, maximum: 2, default: 1 }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, rendering, uploading, completed, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        created_at: { type: string, format: date-time }
        renderDispatch: { type: string, enum: [dispatched, scheduled_fallback] }
    JobStatus:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            title: { type: string }
            error: { type: string }
            output_bytes: { type: integer }
            attempt_count: { type: integer }
            max_attempts: { type: integer }
            qc_report: { type: object }
            updated_at: { type: string, format: date-time }
