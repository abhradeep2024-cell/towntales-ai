openapi: 3.1.0
info:
  title: ChatGPT Film Studio API
  version: 0.1.0
  description: Authenticated interface for creating and managing video production jobs.
servers:
  - url: https://film-studio-api.onrender.com
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Check API health
      security: []
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  databaseConfigured: { type: boolean }
                  databaseConnected: { type: boolean }
  /openapi.yaml:
    get:
      operationId: getOpenApiSchema
      summary: Get the current Film Studio Action schema
      security: []
      responses:
        '200':
          description: OpenAPI schema
          content:
            application/yaml:
              schema: { type: string }
  /v1/styles:
    get:
      operationId: listFilmStyles
      summary: List the pinned Lemo-Opuscar styles
      parameters:
        - in: query
          name: q
          required: false
          schema: { type: string }
          description: Search style name, slug, translated name or sample title.
        - in: query
          name: category
          required: false
          schema: { type: string }
          description: Exact Lemo style category.
      responses:
        '200':
          description: Available visual styles
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  styles:
                    type: array
                    items: { $ref: '#/components/schemas/Style' }
        '401': { description: Unauthorized }
  /v1/styles/{slug}/engine:
    get:
      operationId: getFilmStyleEngine
      summary: List pinned style source files or read a specific file
      description: >-
        Without file, returns the selected style's engine, bootstrap and demo-reference file list.
        Supply file using one exact path from that list to retrieve its source. Demo-reference files can
        contain story-specific example content and must only be studied for implementation technique.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: file
          required: false
          schema: { type: string }
          description: Exact relative path returned by the listing response (for example engine/deco.js).
      responses:
        '200':
          description: Style source index or one pinned source file
          content:
            application/json:
              schema:
                type: object
                properties:
                  styleSlug: { type: string }
                  file: { type: string }
                  role: { type: string, enum: [engine, bootstrap, demo-reference] }
                  sourceCommit: { type: string }
                  content: { type: string }
                  engineFiles: { type: array, items: { type: object } }
                  bootstrapFiles: { type: array, items: { type: object } }
                  demoReferenceFiles: { type: array, items: { type: object } }
        '401': { description: Unauthorized }
        '404': { description: Style or source file not found }
        '502': { description: Pinned source unavailable }
  /v1/styles/{slug}:
    get:
      operationId: getFilmStyleGuide
      summary: Retrieve a style's directing and visual invariants
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Style and full STYLE.md guide
          content:
            application/json:
              schema:
                type: object
                properties:
                  style: { $ref: '#/components/schemas/Style' }
                  styleGuide: { type: string }
                  sourceCommit: { type: string }
        '401': { description: Unauthorized }
        '404': { description: Style not found }
  /v1/intake:
    post:
      operationId: submitProductionSource
      summary: Upload and extract a DOCX, TXT or JSON production brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64]
              properties:
                filename: { type: string, maxLength: 180 }
                contentBase64: { type: string, contentEncoding: base64 }
                title: { type: string, maxLength: 160 }
                description: { type: string, maxLength: 4000 }
                styleId: { type: string, maxLength: 100 }
                aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1'] }
      responses:
        '201': { description: Source extracted and project created }
        '400': { description: Invalid or unsupported source file }
        '401': { description: Unauthorized }
        '413': { description: Source exceeds size limit }
        '503': { description: Source could not be persisted }
  /v1/projects/{id}/plan:
    post:
      operationId: planProjectProduction
      summary: Interpret an uploaded story and create a validated render job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Validated production plan and render job queued }
        '401': { description: Unauthorized }
        '404': { description: Project or extracted source not found }
        '422': { description: Generated plan failed contract validation }
        '502': { description: AI provider or planning response failed }
        '503': { description: Planner configuration or persistence unavailable }
  /v1/assets:
    get:
      operationId: listReusableAssets
      summary: Search the private versioned asset library
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Matching ready assets with expiring signed URLs }
        '400': { description: Invalid asset filter }
        '401': { description: Unauthorized }
        '503': { description: Asset library unavailable }
    post:
      operationId: registerReusableAsset
      summary: Upload and register a versioned reusable production asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetKey, version, assetType, displayName, filename, mimeType, contentBase64]
              properties:
                assetKey: { type: string, maxLength: 120 }
                version: { type: integer, minimum: 1 }
                assetType: { type: string, enum: [character, rig, environment, prop, material, texture, animation, music, voice, sound-effect, font, image, video, other] }
                displayName: { type: string, maxLength: 160 }
                filename: { type: string, maxLength: 120 }
                mimeType: { type: string }
                contentBase64: { type: string, contentEncoding: base64 }
                metadata: { type: object }
                provenance: { type: object }
      responses:
        '201': { description: Asset stored and registered }
        '400': { description: Invalid asset metadata }
        '401': { description: Unauthorized }
        '413': { description: Asset exceeds 5 MB }
        '503': { description: Asset registration failed }
  /v1/jobs:
    post:
      operationId: createRenderJob
      summary: Create a video production job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [production]
              properties:
                production:
                  $ref: '#/components/schemas/ProductionSpec'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': { description: Invalid production specification }
        '401': { description: Unauthorized }
        '503': { description: Job creation unavailable }
  /v1/jobs/{id}:
    get:
      operationId: getRenderJob
      summary: Get job status and quality report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401': { description: Unauthorized }
        '404': { description: Job not found }
  /v1/jobs/{id}/retry:
    post:
      operationId: retryRenderJob
      summary: Requeue a failed job when retry attempts remain
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Retry queued }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Job is not retryable or retry limit reached }
        '503': { description: Retry operation unavailable }
  /v1/jobs/{id}/cancel:
    post:
      operationId: cancelRenderJob
      summary: Cancel a queued or rendering job
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cancellation recorded }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Job is not cancellable }
  /v1/jobs/{id}/artifacts:
    get:
      operationId: getRenderArtifacts
      summary: Retrieve signed URLs for verified production manifest, alignment and QA sidecars
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Short-lived signed URLs for available production artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        url: { type: string, format: uri }
                        expiresInSeconds: { type: integer }
                        bytes: { type: integer }
                        sha256: { type: string }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Artifacts not ready }
  /v1/jobs/{id}/output:
    get:
      operationId: getRenderOutput
      summary: Retrieve a short-lived signed MP4 URL after QC
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed output URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresInSeconds]
                properties:
                  url: { type: string, format: uri }
                  expiresInSeconds: { type: integer }
        '401': { description: Unauthorized }
        '404': { description: Job not found }
        '409': { description: Output not ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Style:
      type: object
      required: [slug, name, category]
      properties:
        slug: { type: string }
        name: { type: string }
        nameZh: { type: string }
        category: { type: string }
        demo: { type: string }
    Scene:
      type: object
      required: [id, title, durationSeconds, visualDirection]
      properties:
        id: { type: string, maxLength: 80 }
        title: { type: string, maxLength: 160 }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 90 }
        narration: { type: string, maxLength: 5000 }
        visualDirection: { type: string, maxLength: 4000 }
        environmentId: { type: string, maxLength: 100 }
        onScreenText:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    AssetReference:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [character, rig, environment, prop, material, texture, animation, music, voice, sound-effect, font, image, video, other] }
        uri: { type: string }
        version: { type: string }
        libraryAssetKey: { type: string }
        libraryVersion: { type: integer, minimum: 1 }
        required: { type: boolean }
        metadata: { type: object }
    VoiceProfile:
      type: object
      required: [id, name, provider, voice]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [edge-tts, espeak-ng] }
        voice: { type: string }
        language: { type: string }
        rate: { type: string }
        pitch: { type: string }
        volume: { type: string }
    Character:
      type: object
      required: [id, name, rig]
      properties:
        id: { type: string }
        name: { type: string }
        rig: { type: string, enum: [block-humanoid] }
        appearance: { type: object }
    Environment:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        assetId: { type: string }
        locationDescription: { type: string }
        timeOfDay: { type: string }
        weather: { type: string }
        atmosphere: { type: string }
        background: { type: string }
        groundColor: { type: string }
        groundSize: { type: number, minimum: 10, maximum: 500 }
        props: { type: array, items: { type: object } }
        fog:
          type: object
          required: [color, near, far]
          properties:
            color: { type: string }
            near: { type: number, minimum: 0 }
            far: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        continuityNotes: { type: array, items: { type: string } }
    ProductionSpec:
      type: object
      required: [schemaVersion, title, idea, styleId, durationSeconds, aspectRatio, scenes]
      properties:
        schemaVersion: { type: integer, enum: [1, 2] }
        title: { type: string, minLength: 1, maxLength: 160 }
        idea: { type: string, minLength: 1, maxLength: 8000 }
        styleId: { type: string, minLength: 1, maxLength: 120 }
        styleInvariants:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 500 }
        durationSeconds: { type: integer, minimum: 1, maximum: 90 }
        aspectRatio: { type: string, enum: ['16:9', '9:16', '1:1'] }
        fps: { type: integer, enum: [24, 25, 30], default: 30 }
        width: { type: integer, minimum: 320, maximum: 1920, description: 'Optional. If omitted, derived from aspectRatio; defaults to 1280 for 16:9, 720 for 9:16, and 1080 for 1:1.' }
        height: { type: integer, minimum: 320, maximum: 1920, description: 'Optional. If omitted, derived from aspectRatio; defaults to 720 for 16:9, 1280 for 9:16, and 1080 for 1:1.' }
        projectFiles:
          type: object
          description: >-
            Optional complete Lemo-Opuscar film page, generated specifically for this production.
            Must contain index.html implementing window.DUR, window.render(t), and window.READY.
            Use only local text files; keep the total below 1.8 MB. No remote scripts or assets.
          additionalProperties: { type: string }
        assets:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/AssetReference' }
        shots:
          type: array
          maxItems: 300
          items: { type: object, required: [id, sceneId, startSeconds, durationSeconds], properties: { id: { type: string }, sceneId: { type: string }, startSeconds: { type: number }, durationSeconds: { type: number }, assetIds: { type: array, items: { type: string } } } }
        tracks:
          type: array
          maxItems: 500
          items: { type: object }
        voiceProfiles:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/VoiceProfile' }
        dialogue:
          type: array
          maxItems: 1000
          items: { type: object, required: [id, sceneId, speaker, text], properties: { id: { type: string }, sceneId: { type: string }, characterId: { type: string }, voiceProfileId: { type: string }, speaker: { type: string }, text: { type: string }, startSeconds: { type: number }, endSeconds: { type: number } } }
        audioCues:
          type: array
          maxItems: 1000
          items: { type: object, required: [id, sceneId, type, label, startSeconds], properties: { id: { type: string }, sceneId: { type: string }, type: { type: string }, label: { type: string }, startSeconds: { type: number }, durationSeconds: { type: number } } }
        captionCues:
          type: array
          maxItems: 2000
          items: { type: object, required: [id, sceneId, text, startSeconds, endSeconds], properties: { id: { type: string }, sceneId: { type: string }, text: { type: string }, startSeconds: { type: number }, endSeconds: { type: number } } }
        outputProfiles:
          type: array
          maxItems: 20
          items: { type: object, required: [id, width, height, fps], properties: { id: { type: string }, width: { type: integer }, height: { type: integer }, fps: { type: integer }, codec: { type: string }, container: { type: string }, quality: { type: string } } }
        qaRules:
          type: array
          maxItems: 200
          items: { type: object, required: [id, category, description], properties: { id: { type: string }, category: { type: string }, severity: { type: string }, description: { type: string }, enabled: { type: boolean } } }
        projectMetadata:
          type: object
          properties:
            projectId: { type: string }
            episodeId: { type: string }
            language: { type: string }
            locale: { type: string }
            targetPlatform: { type: string }
            notes: { type: array, items: { type: string } }
        environments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Environment' }
        characters:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Character' }
        scenes:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/Scene' }
        subtitles:
          type: array
          maxItems: 300
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: number, minimum: 0 }
              end: { type: number, exclusiveMinimum: 0 }
              text: { type: string, minLength: 1, maxLength: 500 }
        audio:
          type: object
          properties:
            musicEnabled: { type: boolean, default: true }
            voiceEnabled: { type: boolean, default: true }
            burnSubtitles: { type: boolean, default: false }
            voice: { type: string, default: en-US-AriaNeural }
            musicStyle: { type: string, enum: [ambient, uplifting, suspense], default: ambient }
            musicVolume: { type: number, minimum: 0, maximum: 0.5, default: 0.12 }
            voiceVolume: { type: number, minimum: 0, maximum: 2, default: 1 }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, rendering, uploading, completed, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        created_at: { type: string, format: date-time }
        renderDispatch: { type: string, enum: [dispatched, scheduled_fallback] }
    JobStatus:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            title: { type: string }
            error: { type: string }
            output_bytes: { type: integer }
            attempt_count: { type: integer }
            max_attempts: { type: integer }
            qc_report: { type: object }
            updated_at: { type: string, format: date-time }
