name: Film Studio Renderer
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: film-studio-render-queue
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  render-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      RENDERER_SHARED_SECRET: ${{ secrets.RENDERER_SHARED_SECRET }}
      SUPABASE_STORAGE_BUCKET: towntales-assets
      RENDER_ONCE: 'true'
      REMOTION_CONCURRENCY: '2'
    steps:
      - name: Check required deployment secrets
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY API_BASE_URL RENDERER_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::notice::Repository secret $name is not configured. Renderer run skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "FILM_STUDIO_SECRETS_MISSING=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install system FFmpeg and local voice fallback
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install application dependencies
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        run: npm install --no-audit --no-fund
      - name: Install Lemo-Opuscar renderer dependencies
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        run: |
          npm --prefix vendor/lemo-opuscar install --no-audit --no-fund
          node vendor/lemo-opuscar/node_modules/playwright-core/cli.js install chromium-headless-shell
      - name: Install optional Edge TTS
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check edge-tts
      - name: Build application workspaces
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        run: npm run build
      - name: Ensure Remotion browser
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        working-directory: apps/renderer
        run: npx remotion browser ensure
      - name: Claim and render one queued job
        if: env.FILM_STUDIO_SECRETS_MISSING != 'true'
        env:
          PYTHON_EXECUTABLE: .venv/bin/python
        run: npm run render:worker:once --workspace=apps/renderer
