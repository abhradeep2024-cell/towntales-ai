name: Film Studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch pull request base history for secret scan
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" --depth=2
      - name: Scan full repository history for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Lemo renderer dependencies
        run: |
          npm --prefix vendor/lemo-opuscar install --no-audit --no-fund
          node vendor/lemo-opuscar/node_modules/playwright-core/cli.js install chromium-headless-shell
      - name: Install system audio/video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install optional Edge TTS into an isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check edge-tts
      - name: Build and type-check
        run: npm run build && npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Test audio alignment and kinetic caption generation
        run: python3 -m unittest discover -s apps/renderer/scripts -p 'test_*.py' -v
      - name: Wait for deployed Render API and verify ChatGPT Action schema and database
        if: github.event_name == 'push'
        run: |
          ready=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 12 https://film-studio-api.onrender.com/openapi.yaml -o /tmp/film-studio-openapi.yaml; then
              if grep -q '^openapi: 3.1.0' /tmp/film-studio-openapi.yaml && grep -q '  /v1/styles/{slug}/engine:' /tmp/film-studio-openapi.yaml && grep -q '  /v1/jobs:' /tmp/film-studio-openapi.yaml && grep -q '  /v1/jobs/{id}/artifacts:' /tmp/film-studio-openapi.yaml; then
                ready=1
                break
              fi
            fi
            echo "Waiting for Render to serve the latest Action schema (attempt $attempt/24)..."
            sleep 10
          done
          test "$ready" -eq 1
          curl -fsS --max-time 12 https://film-studio-api.onrender.com/ | grep -q '"ok":true'
          db_ready=0
          for attempt in $(seq 1 6); do
            health_code=$(curl -sS --max-time 15 -o /tmp/film-studio-health.json -w '%{http_code}' https://film-studio-api.onrender.com/health || true)
            echo "Render /health attempt $attempt/6: HTTP $health_code"
            cat /tmp/film-studio-health.json || true
            if [ "$health_code" = "200" ] && jq -e '.ok == true and .databaseConfigured == true and .databaseConnected == true' /tmp/film-studio-health.json >/dev/null; then
              db_ready=1
              break
            fi
            sleep 10
          done
          if [ "$db_ready" != "1" ]; then
            echo "::error::Render API is reachable, but Supabase database health did not pass. Verify SUPABASE_URL and the matching SUPABASE_SECRET_KEY in Render."
            exit 1
          fi
      - name: Ensure Remotion browser
        working-directory: apps/renderer
        run: npx remotion browser ensure
      - name: Render landscape Remotion smoke
        run: npm run render:smoke
      - name: Generate voice and procedural music and mux
        run: |
          PYTHON_EXECUTABLE=.venv/bin/python .venv/bin/python apps/renderer/scripts/audio_pipeline.py \
            --spec apps/renderer/fixtures/audio-voice-smoke.json \
            --video /tmp/film-studio-smoke.mp4 \
            --output /tmp/film-studio-audio-smoke.mp4 \
            --workdir /tmp/film-studio-audio-test
      - name: Render three-scene timeline
        run: npm run render:smoke:multi
      - name: Render vertical 9:16 format
        run: npm run render:smoke:vertical
      - name: Render Lemo-Opuscar project-page contract
        run: npm run render:lemo:smoke
      - name: Render a new film with the native Art Deco engine modules
        run: npm run render:lemo:art-deco
      - name: Prepare approved Episode 01 narration, word timing, music and sound effects
        run: |
          PYTHON_EXECUTABLE=.venv/bin/python .venv/bin/python apps/renderer/scripts/audio_pipeline.py \
            --spec apps/renderer/fixtures/episode-01-roblox.json \
            --workdir /tmp/towntales-episode-01-audio \
            --prepare-only --require-word-alignment
          test -s /tmp/towntales-episode-01-audio/audio-manifest.json
          test -s /tmp/towntales-episode-01-audio/word-alignments.json
          cp /tmp/towntales-episode-01-audio/word-alignments.json /tmp/towntales-episode-01-word-alignments.json
      - name: Render and mux low-resolution Episode 01 preview before master
        working-directory: apps/renderer
        run: |
          node --import tsx scripts/render-episode.mjs TownTalesEpisode01Preview \
            /tmp/towntales-episode-01-audio/word-alignments.json \
            /tmp/towntales-episode-01-preview-silent.mp4
          PYTHON_EXECUTABLE=../../.venv/bin/python ../../.venv/bin/python scripts/audio_pipeline.py \
            --spec fixtures/episode-01-roblox.json \
            --video /tmp/towntales-episode-01-preview-silent.mp4 \
            --output /tmp/towntales-episode-01-preview.mp4 \
            --workdir /tmp/towntales-episode-01-audio \
            --reuse-prepared --require-word-alignment
          ffmpeg -v error -i /tmp/towntales-episode-01-preview.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json /tmp/towntales-episode-01-preview.mp4
      - name: Create the nine-scene low-resolution preview contact sheet
        run: |
          ffmpeg -y -v error -i /tmp/towntales-episode-01-preview.mp4 \
            -vf "select='eq(n,75)+eq(n,240)+eq(n,420)+eq(n,615)+eq(n,825)+eq(n,1050)+eq(n,1350)+eq(n,1605)+eq(n,1740)',scale=180:320,tile=3x3" \
            -vsync 0 -frames:v 1 /tmp/towntales-episode-01-preview-contact-sheet.jpg
          test -s /tmp/towntales-episode-01-preview-contact-sheet.jpg
      - name: Render and mux full-resolution TownTales Episode 01 master using the same prepared narration
        working-directory: apps/renderer
        run: |
          node --import tsx scripts/render-episode.mjs TownTalesEpisode01Production \
            /tmp/towntales-episode-01-audio/word-alignments.json \
            /tmp/towntales-episode-01-production-silent.mp4
          PYTHON_EXECUTABLE=../../.venv/bin/python ../../.venv/bin/python scripts/audio_pipeline.py \
            --spec fixtures/episode-01-roblox.json \
            --video /tmp/towntales-episode-01-production-silent.mp4 \
            --output /tmp/towntales-episode-01.mp4 \
            --workdir /tmp/towntales-episode-01-audio \
            --reuse-prepared --require-word-alignment
      - name: Validate all MP4 outputs
        run: |
          for f in /tmp/film-studio-smoke.mp4 /tmp/film-studio-audio-smoke.mp4 /tmp/film-studio-multi-scene.mp4 /tmp/film-studio-vertical.mp4 /tmp/film-studio-lemo-smoke.mp4 /tmp/film-studio-lemo-art-deco.mp4 /tmp/towntales-episode-01-preview.mp4 /tmp/towntales-episode-01.mp4; do
            test -s "$f"
            ffmpeg -v error -i "$f" -f null -
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json "$f"
          done
          python - <<'PY'
          import json, subprocess
          def probe(path):
              raw = subprocess.check_output([
                  "ffprobe", "-v", "error", "-count_frames", "-show_entries",
                  "format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,nb_read_frames",
                  "-of", "json", path
              ], text=True)
              data = json.loads(raw)
              streams = data.get("streams", [])
              video = [s for s in streams if s.get("codec_type") == "video"]
              audio = [s for s in streams if s.get("codec_type") == "audio"]
              assert len(video) == 1, f"{path}: expected exactly one video stream"
              assert len(audio) >= 1, f"{path}: missing audio stream"
              return data, video[0], audio[0]
          preview_path = "/tmp/towntales-episode-01-preview.mp4"
          preview_data, preview_video, preview_audio = probe(preview_path)
          assert preview_video.get("codec_name") == "h264", "Preview must be H.264"
          assert preview_audio.get("codec_name") == "aac", "Preview audio must be AAC"
          assert (preview_video.get("width"), preview_video.get("height")) == (360, 640), "Preview must be 360x640"
          assert preview_video.get("r_frame_rate") == "30/1", "Preview must be 30 FPS"
          assert abs(float(preview_data["format"]["duration"]) - 60.0) <= 0.15, "Preview must be 60 seconds"
          assert int(preview_video.get("nb_read_frames", "0")) == 1800, "Preview must contain 1800 frames"
          print("Episode 01 low-resolution preview contract passed.")
          path = "/tmp/towntales-episode-01.mp4"
          data, v, a = probe(path)
          audio = [a]
          assert v.get("codec_name") == "h264", f"Expected H.264, got {v.get('codec_name')}"
          assert audio[0].get("codec_name") == "aac", f"Expected AAC, got {audio[0].get('codec_name')}"
          assert (v.get("width"), v.get("height")) == (1080, 1920), f"Unexpected master dimensions: {v.get('width')}x{v.get('height')}"
          assert v.get("r_frame_rate") == "30/1", f"Expected 30 FPS, got {v.get('r_frame_rate')}"
          assert v.get("avg_frame_rate") == "30/1", f"Expected average 30 FPS, got {v.get('avg_frame_rate')}"
          duration = float(data["format"]["duration"])
          assert abs(duration - 60.0) <= 0.15, f"Expected 60s duration, got {duration}"
          size = int(data["format"]["size"])
          assert 100_000 < size <= 50 * 1024 * 1024, f"Master output size outside private bucket limit: {size}"
          frames = int(v.get("nb_read_frames", v.get("nb_frames", "0")))
          assert frames == 1800, f"Expected 1800 frames, got {frames}"
          print("Episode 01 master contract passed: 60s, 1080x1920, 30fps, H.264 + AAC, 1800 frames")
          PY
      - name: Render a full-resolution Episode 01 master frame
        run: |
          npx remotion still apps/renderer/src/index.tsx TownTalesEpisode01Production /tmp/towntales-episode-01-master-frame.png --frame=900 --log=error
          dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/towntales-episode-01-master-frame.png)
          test "$dimensions" = "1080x1920"
      - name: Verify private Supabase upload, signed download and MP4 decode
        working-directory: apps/renderer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: node scripts/verify-storage-upload.mjs /tmp/towntales-episode-01.mp4
      - name: Generate Episode 01 visual contact sheet
        run: |
          ffmpeg -y -v error -i /tmp/towntales-episode-01.mp4 \
            -vf "select='eq(n,75)+eq(n,240)+eq(n,420)+eq(n,615)+eq(n,825)+eq(n,1050)+eq(n,1350)+eq(n,1605)+eq(n,1740)',scale=180:320,tile=3x3" \
            -vsync 0 -frames:v 1 /tmp/towntales-episode-01-contact-sheet.jpg
          test -s /tmp/towntales-episode-01-contact-sheet.jpg
      - name: Upload video test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: film-studio-render-suite
          path: |
            /tmp/film-studio-smoke.mp4
            /tmp/film-studio-audio-smoke.mp4
            /tmp/film-studio-multi-scene.mp4
            /tmp/film-studio-vertical.mp4
            /tmp/film-studio-lemo-smoke.mp4
            /tmp/film-studio-lemo-art-deco.mp4
            /tmp/towntales-episode-01-preview.mp4
            /tmp/towntales-episode-01-preview-contact-sheet.jpg
            /tmp/towntales-episode-01.mp4
            /tmp/towntales-episode-01-word-alignments.json
            /tmp/towntales-episode-01-audio/audio-manifest.json
            /tmp/towntales-episode-01-audio/word-captions.ass
            /tmp/towntales-episode-01-master-frame.png
            /tmp/towntales-episode-01-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 7
