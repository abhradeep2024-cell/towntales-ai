<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Film Studio Lemo Smoke</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
    canvas{display:block;width:100vw;height:100vh}
  </style>
</head>
<body>
<canvas id="film"></canvas>
<script>
const canvas = document.getElementById('film');
const ctx = canvas.getContext('2d');
const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
resize();
window.addEventListener('resize', resize);
window.DUR = 5;
window.render = (t) => {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const bg = ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,'#101522'); bg.addColorStop(1,'#243c48');
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  const progress = Math.max(0,Math.min(1,t/4.5));
  const cx = w/2, cy = h/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate((progress-.5)*.08);
  ctx.strokeStyle = '#d7b56d';
  ctx.lineWidth = Math.max(2,w/640);
  ctx.strokeRect(-w*.34,-h*.22,w*.68,h*.44);
  ctx.fillStyle = '#f7f1e5';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 '+Math.max(26,Math.round(w*.055))+'px Arial';
  ctx.fillText('LEMO FILM PAGE',0,-h*.035);
  ctx.font = '500 '+Math.max(14,Math.round(w*.018))+'px Arial';
  ctx.fillStyle = '#d7b56d';
  ctx.fillText('DETERMINISTIC FRAME '+String(Math.round(t*30)).padStart(3,'0'),0,h*.08);
  ctx.restore();
  ctx.globalAlpha = .25 + .3*Math.sin(t*Math.PI/2);
  ctx.fillStyle = '#d7b56d';
  ctx.beginPath(); ctx.arc(w*.16,h*.18,Math.max(2,w*.005),0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
};
window.READY = true;
</script>
</body>
</html>
